[package]
name = "myparcel-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Unofficial async client for the MyParcel API"
license = "MIT"
repository = "https://github.com/robmeijerink/myparcel-rs"
readme = "README.md"
keywords = ["myparcel", "shipping", "labels", "api-client"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = [".github", "tests"]

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
blocking = ["reqwest/blocking"]
connect = ["dep:aes-gcm", "dep:p256", "dep:sha2", "dep:subtle"]

[dependencies]
aes-gcm = { version = "0.11", optional = true }
base64 = "0.23"
getrandom = "0.4"
p256 = { version = "0.14", optional = true, features = ["ecdsa", "pem"] }
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", optional = true }
subtle = { version = "2", optional = true }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde", "serde-well-known"] }
url = { version = "2", features = ["serde"] }
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
jsonschema = "0.61"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
